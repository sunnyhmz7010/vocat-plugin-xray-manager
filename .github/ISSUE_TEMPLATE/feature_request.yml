name: Feature Request / 功能建议
description: Suggest a feature or improvement for VoCat Xray Manager / 为 Xray管理插件提出新功能或改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your idea. Keep node credentials, passwords and SIM identifiers out of the request.
        感谢你提出建议。请勿提供节点凭据、密码或 SIM 标识。

  - type: textarea
    id: use-case
    attributes:
      label: Use Case / 使用场景
      description: What are you trying to do with Xray Manager, and where is the current pain point? / 你希望通过 Xray管理完成什么操作，当前卡点在哪里？
      placeholder: Describe the scenario briefly. / 简要描述场景。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Expected Improvement / 期望改进
      description: What would you like Xray Manager to do? / 你希望 Xray管理怎么做？
      placeholder: Describe the desired behavior; for protocol requests, name the protocol, transport and required parameters without credentials. / 描述期望行为；协议支持建议请填写协议、传输及所需参数名，不提供凭据。

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered / 备选方案
      description: Any other approaches you have thought about? / 你考虑过的其他方案？

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist / 提交前确认
      options:
        - label: I have searched existing issues before submitting this request. / 我已先搜索过现有 Issue。
          required: true
